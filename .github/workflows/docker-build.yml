name: Verify and Build Images

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scraper/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/workspace-verify.yml
    permissions:
      contents: read

  changes:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      scraper: ${{ steps.filter.outputs.scraper }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/docker-image.yml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/docker-image.yml'
            scraper:
              - 'scraper/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/docker-image.yml'

  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
    with:
      image: ghcr.io/${{ github.repository_owner }}/pricestalker-backend
      dockerfile: ./backend/Dockerfile
      cache-scope: backend
      publish: false
      channel: beta

  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
    with:
      image: ghcr.io/${{ github.repository_owner }}/pricestalker-frontend
      dockerfile: ./frontend/Dockerfile
      cache-scope: frontend
      publish: false
      channel: beta

  build-scraper:
    needs: changes
    if: needs.changes.outputs.scraper == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/docker-image.yml
    permissions:
      contents: read
    with:
      image: ghcr.io/${{ github.repository_owner }}/pricestalker-scraper
      dockerfile: ./scraper/Dockerfile
      cache-scope: scraper
      publish: false
      channel: beta
